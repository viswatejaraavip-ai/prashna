name: CI

# Every push and every pull request. `deploy.yml` waits for this workflow to
# succeed on `main` before it builds and deploys to Cloud Run, so a red CI is
# a blocked deploy. Nothing here needs cloud credentials: the integration
# suite runs the real FastAPI app against an in-memory Firestore and fake
# model/Play/Razorpay/Speech/FCM clients (docs/launch/TESTING.md).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Matches the deterministic environment of backend/scripts/run_integration.sh.
      JWT_SECRET: ci-test-secret-0123456789abcdef
      GOOGLE_CLOUD_PROJECT: test-project
      ADMIN_EMAILS: owner@example.com
      TRIAL_CREDIT_UNITS: "1000"
      DEFAULT_LANG: te
      ENGINE_PATH: ${{ github.workspace }}/engine
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"          # same as the Dockerfile
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-gcp.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-gcp.txt
          pip install pytest

      - name: Import check (the app really loads)
        working-directory: backend
        run: python -c "from app import main_gcp; print(len(main_gcp.app.routes), 'routes')"

      - name: Unit tests
        working-directory: backend
        run: |
          python -m pytest tests --ignore=tests/integration \
            -W ignore -q --junitxml=../unit-results.xml

      - name: Integration tests (every user flow)
        working-directory: backend
        run: |
          python -m pytest tests/integration \
            -W ignore -q -rxX --durations=10 --junitxml=../integration-results.xml

      - name: Report
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          print("| Suite | Tests | Failures | Errors | Skipped | Time |")
          print("|---|---:|---:|---:|---:|---:|")
          for path in sorted(glob.glob("*-results.xml")):
              s = ET.parse(path).getroot()
              s = s if s.tag == "testsuite" else s.find("testsuite")
              g = lambda k: s.get(k, "0")
              print("| %s | %s | %s | %s | %s | %ss |" % (
                  path.replace("-results.xml", ""), g("tests"), g("failures"),
                  g("errors"), g("skipped"), g("time")))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: "*-results.xml"
          if-no-files-found: ignore

  android:
    name: Android unit tests
    # Set the repository variable ANDROID_TESTS=off (Settings -> Secrets and
    # variables -> Actions -> Variables) if the runner cannot provision the
    # Android SDK; the backend job stays required either way.
    if: vars.ANDROID_TESTS != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Firebase config placeholder
        # google-services.json is per-project and gitignored; the unit tests
        # never talk to Firebase, but the Gradle plugin needs the file.
        run: cp android/app/google-services.example.json android/app/google-services.json

      - name: ./gradlew testDebugUnitTest
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: android/app/build/reports/tests/**
          if-no-files-found: ignore

  ci:
    # Single required status check for branch protection on `main`, and the
    # gate `deploy.yml` waits on.
    name: CI
    needs: [backend, android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "backend=${{ needs.backend.result }} android=${{ needs.android.result }}"
          [ "${{ needs.backend.result }}" = "success" ] || exit 1
          case "${{ needs.android.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
